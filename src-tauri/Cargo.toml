[package]
name = "jotted-app"
version = "0.1.0"
description = "Jotted: your reMarkable to-do list on the desktop"
edition = "2021"
rust-version = "1.80"

[lib]
name = "jotted_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "signal"] }
libc = "0.2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
minisign-verify = "0.3.0"
sha2 = "0.10.9"
flate2 = "1.1.10"
tar = "0.4.46"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
minisign = "0.10.0"
tempfile = "3.27.0"
